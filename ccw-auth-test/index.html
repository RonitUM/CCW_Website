<h1>CCW app auth test</h1><p>Tenant <code>760e00cb-f926-4101-845f-90fd0a72eebf</code><br>Client <code>4fcac966-8904-44ee-be82-9c26fdf23fd2</code></p>
<p>The secret is sent once to a temporary test service, which asks Microsoft for a token and returns only the result. Nothing is stored.</p>

const BACKEND='https://ccw-auth-test.nitkarm.workers.dev/test'; // set at deploy
